name: build-iso
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - run: apk add --no-cache nodejs git make cdrkit unzip
      - uses: actions/checkout@v4
      - run: unzip -o lostcraft_ps2.zip
      - run: |
          cd lostcraft_ps2
          make
          mkdir -p iso && cp lostcraft.elf iso/LOSTCRAFT.ELF
          printf 'BOOT2 = cdrom0:\\LOSTCRAFT.ELF;1\r\nVER = 1.00\r\nVMODE = NTSC\r\n' > iso/SYSTEM.CNF
          genisoimage -o lostcraft.iso iso
      - uses: actions/upload-artifact@v4
        with:
          name: lostcraft
          path: |
            lostcraft_ps2/lostcraft.iso
            lostcraft_ps2/lostcraft.elf
